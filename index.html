:root{--bg:#0a0a0a;--c:#151515;--b:#262626;--t:#f2f2f2;--m:#8a8a8a;--a:#b6ff3b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{background:radial-gradient(900px 500px at 50% -120px,#1b2a0a 0,#0a0a0a 60%) fixed,var(--bg)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #b6ff3b00)}50%{transform:scale(1.08);filter:drop-shadow(0 0 22px #b6ff3b99)}}
@keyframes slide{from{opacity:0;transform:translateX(-16px);background:#b6ff3b30}to{opacity:1;transform:none}}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes ending{50%{opacity:.45}}
#app.anim>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
#app.anim>:nth-child(2){animation-delay:.05s}#app.anim>:nth-child(3){animation-delay:.1s}#app.anim>:nth-child(4){animation-delay:.15s}#app.anim>:nth-child(n+5){animation-delay:.2s}

.logo{font-size:64px;animation:pop .7s both,pulse 2.6s .7s ease-in-out infinite!important}
.anim .card>svg polyline{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.1s .2s ease-out forwards}.anim .card>svg circle{animation:pop .4s 1s both}
.card{transition:border-color .2s,transform .2s}.card:active{transform:scale(.99)}

tr.new{animation:slide .5s both}
.pb{height:4px;background:#222;border-radius:4px;margin:6px 0 8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--a);border-radius:4px;transition:width .5s}
.rb{display:none;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(#1a2310,#151515);border:1px solid var(--a);border-radius:18px;padding:16px;margin-bottom:10px}.rb.show{display:flex;animation:up .35s both}
.ringw{position:relative;width:150px;height:150px}.ringw svg{width:100%}.rt{fill:none;stroke:#262626;stroke-width:6}.rg{fill:none;stroke:var(--a);stroke-width:6;stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 6px #b6ff3b88)}
#rest{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}.rb.end .rg{stroke:#ff9f43}.rb.end #rest{animation:ending 1s infinite;color:#ff9f43}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--a);color:#000;font-weight:700;padding:12px 18px;border-radius:999px;z-index:20;animation:tin .4s both;box-shadow:0 8px 30px #b6ff3b55;max-width:90vw;text-align:center}
.cf{position:fixed;bottom:110px;width:8px;height:12px;border-radius:2px;z-index:20;animation:cf 1.3s cubic-bezier(.2,.7,.3,1) forwards}
