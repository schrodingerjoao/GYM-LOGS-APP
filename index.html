mv(e){const p=db.plans.find(q=>q.id==ui.edit),i=+e.dataset.i,j=i+ +e.dataset.d;if(j<0||j>=p.exs.length)return;[p.exs[i],p.exs[j]]=[p.exs[j],p.exs[i]];save();R()},rmex(e){db.plans.find(q=>q.id==ui.edit).exs.splice(e.dataset.i,1);save();R()},
savebody(){const r={date:today()};BF.forEach(([f])=>{const v=$('#b_'+f).value;if(v)r[f]=+v});if(Object.keys(r).length<2)return;db.body=db.body.filter(b=>b.date!=r.date).concat(r).sort((a,b)=>a.date<b.date?-1:1);save();R()},delbody(e){db.body=db.body.filter(b=>b.date!=e.dataset.d);save();R()},
addlib(){const n=$('#ln').value.trim();if(!n)return;db.ex.push({id:uid(),name:n,group:$('#lg').value,equip:$('#le').value,notes:$('#li').value,custom:1});save();R()},dellib(e){db.ex=db.ex.filter(x=>x.id!=e.dataset.id);save();R()},
expj(){dl('guri-logs-backup-'+today()+'.json',JSON.stringify(db),'application/json')},
expc(){const rows=['data,treino,exercicio,grupo,serie,kg,reps,rir'];db.sessions.forEach(s=>s.logs.forEach(l=>l.sets.forEach((x,i)=>rows.push([s.date,s.name,ex(l.ex).name,ex(l.ex).group,i+1,x.kg,x.reps,x.rir??''].map(v=>`"${v}"`).join(',')))));dl('guri-logs.csv',rows.join('\n'),'text/csv')},
reset(){if(confirm('Apagar TODOS os dados?')){try{localStorage.removeItem(K)}catch(e){}location.reload()}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.sk!==undefined){const s=db.active&&db.active.logs[db.active.i].sets[t.dataset.sk],v=t.value===''?null:+t.value,f=t.dataset.sf;if(s&&(f=='rir'?(v===null||v>=0):v>0)){s[f]=v;save()}else R()}else if(t.dataset.f){const p=db.plans.find(q=>q.id==ui.edit);if(t.dataset.i===undefined)p.name=t.value;else p.exs[t.dataset.i][t.dataset.f]=t.type=='number'?+t.value:t.value;save()}
 else if(t.id=='sx'){ui.sx=t.value;R()}else if(t.id=='dr'){db.rest=+t.value||90;save()}else if(t.id=='un2'){db.user=t.value.trim()||db.user;save()}
 else if(t.id=='imp'){const f=t.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!d.sessions||!d.ex)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){db=d;save();R()}}catch(x){alert('Arquivo inválido.')}})}});
document.addEventListener('input',e=>{if(e.target.id=='eq'){ui.eq=e.target.value;$('#el').innerHTML=pick()}else if(e.target.id=='q'){ui.q=e.target.value;$('#ll').innerHTML=libList()}else if(e.target.id=='gf'){ui.grp=e.target.value;$('#ll').innerHTML=libList()}});
document.addEventListener('change',e=>{if(e.target.id=='gf'){ui.grp=e.target.value;$('#ll').innerHTML=libList()}});
function beep(){try{const c=new(window.AudioContext||webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}catch(e){}}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);for(let i=0;i<28;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${50+(Math.random()-.5)*20}%;--x:${(Math.random()-.5)*300}px;--y:${-120-Math.random()*220}px;background:${['#b6ff3b','#fff','#7dd321'][i%3]}`;document.body.appendChild(c);setTimeout(()=>c.remove(),1400)}}
function cu(){document.querySelectorAll('.k').forEach(el=>{const n=parseFloat(el.textContent);if(!Number.isInteger(n)||n<=0)return;const t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/800);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function tick(){const a=db.active;if(!a||view!='train')return;const c=$('#clk');if(c){const s=Math.floor((Date.now()-a.start)/1e3);c.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
 const rb=$('#rb'),r=$('#rest');if(rb){const ms=restEnd-Date.now(),left=Math.ceil(ms/1e3);if(ms>0){rb.classList.add('show');r.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#ring').style.strokeDashoffset=276.46*(1-Math.min(1,ms/(restTot*1e3)));rb.classList.toggle('end',left<=5)}else{if(rb.classList.contains('show')&&restEnd){navigator.vibrate&&navigator.vibrate([200,100,200]);beep()}rb.classList.remove('show','end');restEnd=0}}}
setInterval(tick,500);R();tick();
